<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sound Readings</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>Sound Readings</h1>

<table>
    <thead>
    <tr>
        <th>Timestamp</th>
        <th>Sound Level (dB)</th>
        <th>Student Space</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="reading : ${readings}">
        <td th:text="${reading.timestamp}"></td>
        <td th:text="${reading.soundLevelDb}"></td>
        <td th:text="${reading.displayName}"></td>
        <td th:text="${reading.description}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
